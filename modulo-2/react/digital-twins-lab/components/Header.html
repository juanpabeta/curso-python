<header class="border-b border-gray-200 bg-white shadow-sm">
  <nav
    class="mx-auto flex max-w-screen-xl flex-wrap items-center justify-between px-4 py-4 sm:px-6 lg:px-8"
    aria-label="Navegación principal"
  >
    <a href="#" class="flex items-center gap-3">
      <span
        class="flex h-10 w-10 items-center justify-center rounded-lg bg-blue-700 text-sm font-bold text-white"
        aria-hidden="true"
      >
        DT
      </span>
      <div>
        <p class="text-lg font-bold text-gray-900 sm:text-xl">Digital Twins Lab</p>
        <p class="hidden text-xs text-gray-500 sm:block">
          Simulación inteligente en tiempo real
        </p>
      </div>
    </a>

    <button
      data-collapse-toggle="navbar-lab"
      type="button"
      class="inline-flex h-10 w-10 items-center justify-center rounded-lg p-2 text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200 md:hidden"
      aria-controls="navbar-lab"
      aria-expanded="false"
    >
      <span class="sr-only">Abrir menú principal</span>
      <svg
        class="h-5 w-5"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 17 14"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M1 1h15M1 7h15M1 13h15"
        />
      </svg>
    </button>

    <div class="hidden w-full md:block md:w-auto" id="navbar-lab">
      <ul
        class="mt-4 flex flex-col gap-2 rounded-lg border border-gray-100 bg-gray-50 p-4 font-medium md:mt-0 md:flex-row md:gap-6 md:border-0 md:bg-transparent md:p-0"
      >
        <li>
          <a
            href="#inicio"
            class="block rounded px-3 py-2 text-gray-900 hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700"
            aria-current="page"
          >
            Inicio
          </a>
        </li>
        <li>
          <a
            href="#soluciones"
            class="block rounded px-3 py-2 text-gray-900 hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700"
          >
            Soluciones
          </a>
        </li>
        <li>
          <a
            href="#agenda-demo"
            class="block rounded px-3 py-2 text-gray-900 hover:bg-gray-100 md:hover:bg-transparent md:hover:text-blue-700"
          >
            Agenda tu demo
          </a>
        </li>
      </ul>
    </div>
  </nav>
</header>
