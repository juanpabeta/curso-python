[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-config
    --strict-markers
    --cov=app
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=85
markers =
    unit: pruebas rápidas y aisladas, sin I/O real
    integration: pruebas con componentes reales y SQLite temporal
    e2e: flujos completos a través de la API, sin mocks internos
    security: controles de autenticación, autorización y entradas hostiles
    contract: capacidades esperadas aún no implementadas
filterwarnings =
    ignore:'crypt' is deprecated:DeprecationWarning:passlib.*
